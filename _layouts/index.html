<!DOCTYPE html>
<html lang='en-US'>
    <head>
        <title>{{ site.name }}</title>
        <meta charset='utf-8'>
        <meta name='viewport' content='width=device-width, initial-scale=1'>
        <link rel='icon' type='image/png' href='/assets/icon.png'>
        <link rel='stylesheet' type='text/css' href='/assets/main.css'>
    </head>    
    <body>
        <div class="content">
        <script src='/assets/index.js'></script>
        {%- if site.color-scheme == 'auto' -%}
        <script>autoColorScheme()</script>
        {%- else -%}
        <script>setColorScheme('{{ site.color-scheme }}')</script>
        {%- endif -%}
        {%- include header.html -%}
        <main>
            {%- for item in site.content -%}
            <div class='container'>
                <div class='row'>
                    {%- include section.html section-title=item.section-title text-only=item.text-only content=item.content -%}
                </div>
            </div>
            {%- endfor -%}
        </main>
        {%- include footer.html -%}
        </div>
    </body>
</html>
